<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="American Full Fighting Bons en Chablais. Club de boxe américaine, full contact, stages et inscriptions.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AMERICAN FULL FIGHTING BONS EN CHABLAIS">
  <meta property="og:description" content="Club, calendrier, inscription, boutique et informations pratiques.">
  <title>AMERICAN FULL FIGHTING BONS EN CHABLAIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top">
        <img src="/assets/logo-affbc.png" alt="Logo AFFBC">
        <div>
          <div class="brand-name">AMERICAN FULL FIGHTING</div>
          <div class="brand-sub">BONS EN CHABLAIS</div>
        </div>
      </a>
      <nav class="main-nav">
        <a href="#club">Club</a>
        <a href="#planning">Planning</a>
        <a href="#tarifs">Tarifs</a>
        <a href="https://inscription.americanfullfightingbons.fr/">Inscription</a>
        <a href="https://calendrier.americanfullfightingbons.fr/">Calendrier</a>
        <a href="https://boutique.americanfullfightingbons.fr/">Boutique</a>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <div id="hero-kicker" class="hero-kicker"></div>
          <h1 id="hero-title"></h1>
          <p id="hero-body" class="hero-body"></p>
          <div class="hero-actions">
            <a id="hero-primary" class="btn btn-red" href="#">Préinscription</a>
            <a id="hero-secondary" class="btn btn-dark" href="#">Calendrier</a>
          </div>
          <div class="hero-links">
            <a class="utility-link" href="https://inscription.americanfullfightingbons.fr/">Site d'inscription</a>
            <a class="utility-link" href="https://calendrier.americanfullfightingbons.fr/">Site calendrier</a>
            <a class="utility-link" href="https://boutique.americanfullfightingbons.fr/">Boutique</a>
          </div>
          <div id="inpi-note" class="inpi-note"></div>
        </div>
        <aside class="hero-panel">
          <div class="hero-panel-badge" id="announcement-badge"></div>
          <h2 id="announcement-title"></h2>
          <p id="announcement-body"></p>
          <div class="contact-stack">
            <div><span>E-mail</span><strong id="site-email"></strong></div>
            <div><span>Téléphone</span><strong id="site-phone"></strong></div>
            <div><span>Adresse</span><strong id="site-address"></strong></div>
          </div>
        </aside>
      </div>
    </section>

    <section class="quick-links">
      <div class="quick-links-inner" id="partner-links-top"></div>
    </section>

    <div id="page-sections"></div>
  </main>

  <footer class="site-footer">
    <div id="footer-note"></div>
  </footer>

  <script src="/assets/site.js" defer></script>
</body>
</html>
